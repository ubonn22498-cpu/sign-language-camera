<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSL AI Camera</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}main{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}button{padding:11px 16px;border:0;border-radius:9px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff}.danger{background:#ef4444;color:#fff}.green{background:#10b981;color:#fff}.box{background:#1e293b;border-radius:14px;padding:14px;margin-top:14px}.cam{position:relative;background:#020617;border-radius:12px;overflow:hidden;aspect-ratio:4/3}.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cam canvas{z-index:2}.hud{position:absolute;z-index:3;left:10px;right:10px;top:10px;background:#0f172add;padding:10px;border-radius:9px;font-size:14px}.row{display:flex;justify-content:space-between;gap:10px}.result{font-size:25px;font-weight:700;color:#93c5fd;margin-top:8px}.small{color:#cbd5e1;font-size:13px;line-height:1.5}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form input{padding:11px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff}.status{color:#a5f3fc}.ok{color:#86efac}.warn{color:#fde68a}@media(max-width:650px){.form{grid-template-columns:1fr}.row{display:block}}
</style>
</head>
<body><main>
<div class="top"><div><h2>🤟 กล้องแปลภาษามือไทย</h2><div class="small">หน้านี้ทำงานนอก Google Apps Script เพื่อให้ Chrome อนุญาตใช้กล้อง</div></div><div><button class="primary" id="start">▶ เปิดกล้อง</button> <button class="danger" id="stop">⏹ ปิด</button></div></div>
<div class="box"><div class="cam"><video id="video" playsinline autoplay muted></video><canvas id="canvas"></canvas><div class="hud"><div class="row"><span>กล้อง</span><b id="camState" class="warn">ปิดอยู่</b></div><div class="row"><span>มือ</span><b id="handState">รอ...</b></div><div class="row"><span>แขน</span><b id="armState">รอ...</b></div><div class="row"><span>ความมั่นใจ</span><b id="score">0%</b></div></div></div><div class="result" id="result">— ยังไม่พบคำแปล —</div><div class="small" id="detail">โหลด GestureDB...</div></div>
<div class="box"><h3>➕ เพิ่มท่าใหม่</h3><div class="form"><input id="gid" placeholder="GestureID เช่น ARM_UP"><input id="text" placeholder="คำแปล เช่น ยกแขนขึ้น"><input id="speech" placeholder="ข้อความเสียง (ไม่ใส่ก็ได้)"></div><p class="small">กดเริ่มเก็บ → ทำท่า → กดบันทึกเฟรมหลายครั้ง → บันทึกลง GestureDB</p><button class="green" id="new">🆕 เริ่มเก็บ</button> <button class="primary" id="capture">📸 บันทึกเฟรม</button> <button id="save">☁️ บันทึกลงชีต</button> <button id="clear">🗑️ ล้าง</button><div id="record" class="small">0 เฟรม</div></div>
<div class="box"><button id="tts">🔊 อ่านคำแปล</button> <span id="status" class="small status">กำลังเตรียม AI...</span></div>
</main>
<script>
const params=new URLSearchParams(location.search);const GAS_WEBAPP_URL=params.get('gas')||'https://script.google.com/macros/s/AKfycbxQIJRbi-kO9A-7Cc0bFSP2IzH8IdVEms8Ww8vWBdNXYuOq03NEU5cxI_xu2L8DQeLm/exec
 ';
let stream=null,active=false,raf=0,frameNo=0,processing=false,latestHands=null,latestPose=null,db=[],live=[],recorded=[],recording=false,lastMatch='',lastMatchAt=0;
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let hands=null,pose=null;
const handBones=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function initAI(){
 if(hands)return;
 hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.5,minTrackingConfidence:.5});hands.onResults(r=>latestHands=r);
 pose=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}`});pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});pose.onResults(r=>latestPose=r);
 document.getElementById('status').textContent='AI พร้อมใช้งาน';
}
function loadDB(){return new Promise((resolve,reject)=>{const cb='gestureDBCallback_'+Date.now()+'_'+Math.floor(Math.random()*10000);const s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('หมดเวลาเชื่อมต่อ Google Sheets'))},15000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=(j)=>{cleanup();if(j&&(j.status==='success'||j.status==='ok')){db=j.data||[];document.getElementById('status').textContent=`GestureDB: ${[...new Set(db.map(x=>x.gestureId))].length} ท่า / ${db.length} เฟรม`;document.getElementById('detail').textContent='โหลด GestureDB สำเร็จ';resolve(j)}else{const e=new Error((j&&j.message)||'โหลด GestureDB ไม่สำเร็จ');document.getElementById('status').textContent=e.message;reject(e)}};s.src=GAS_WEBAPP_URL+'?api=getGestureDatabase&callback='+encodeURIComponent(cb)+'&t='+Date.now();s.onerror=()=>{cleanup();document.getElementById('status').textContent='โหลด GestureDB ไม่สำเร็จ';reject(new Error('เชื่อมต่อ Google Sheets ไม่ได้'))};document.body.appendChild(s)})}
function normHand(lm){const w=lm[0],sc=Math.max(.0001,Math.hypot(lm[9].x-w.x,lm[9].y-w.y));return lm.map(p=>({x:(p.x-w.x)/sc,y:(p.y-w.y)/sc,z:(p.z-(w.z||0))/sc}))}
function normPose(lm){const ids=[11,12,13,14,15,16],a=lm[11],b=lm[12];if(!a||!b)return null;const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,sc=Math.max(.0001,Math.hypot(a.x-b.x,a.y-b.y));return ids.map(i=>{const p=lm[i];return p?{x:(p.x-cx)/sc,y:(p.y-cy)/sc,z:(p.z||0)/sc,v:p.visibility||0}:null})}
function snap(){let h=[];(latestHands?.multiHandLandmarks||[]).forEach((lm,i)=>h.push({handedness:latestHands.multiHandedness?.[i]?.label||('Hand'+i),landmarks:normHand(lm)}));h.sort((a,b)=>a.handedness.localeCompare(b.handedness));const p=latestPose?.poseLandmarks?normPose(latestPose.poseLandmarks):null;return h.length||p?{timestamp:Date.now(),hands:h,pose:p}:null}
function dist(a,b){return !a||!b?1:Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z)}
function frameDist(a,b){let t=0,c=0;const bh={};(b.hands||[]).forEach(x=>bh[x.handedness]=x);(a.hands||[]).forEach(x=>{const q=bh[x.handedness]||(b.hands||[])[0];if(!q)return;for(let i=0;i<Math.min(x.landmarks.length,q.landmarks.length);i++){t+=dist(x.landmarks[i],q.landmarks[i]);c++}});if(a.pose&&b.pose)for(let i=0;i<a.pose.length;i++)if(a.pose[i]&&b.pose[i]){t+=dist(a.pose[i],b.pose[i])*.8;c++}return c?t/c:1}
function seqDist(a,b){if(!a.length||!b.length)return 1;const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(Infinity));dp[0][0]=0;for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){const d=frameDist(a[i-1],b[j-1]);dp[i][j]=d+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1])}return dp[n][m]/(n+m)}
const score=d=>Math.max(0,Math.min(100,Math.round(100*Math.exp(-d*1.7))));
function match(){if(live.length<4||!db.length)return;const groups={};db.forEach(r=>(groups[r.gestureId]??=[]).push(r));let best=null;for(const id in groups){const rows=groups[id].sort((a,b)=>a.frameNo-b.frameNo),ref=rows.map(r=>r.landmarkData).filter(Boolean),win=live.slice(Math.max(0,live.length-Math.max(6,Math.min(45,ref.length*3)))),s=score(seqDist(win,ref));if(!best||s>best.score)best={id,score:s,row:rows[0],count:ref.length}}if(best&&best.score>=72){document.getElementById('result').textContent=best.row.text||best.id;document.getElementById('score').textContent=best.score+'%';document.getElementById('detail').textContent=`ท่า: ${best.id} | ${best.count} เฟรม | ${best.score}%`;const now=Date.now();if(best.id!==lastMatch||now-lastMatchAt>3000){lastMatch=best.id;lastMatchAt=now;speak(best.row.speech||best.row.text||best.id)}}else if(best)document.getElementById('score').textContent=best.score+'%'}
function speak(t){if(!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';speechSynthesis.speak(u)}
function draw(){if(!active)return;const W=canvas.width=canvas.clientWidth||640,H=canvas.height=canvas.clientHeight||480;ctx.clearRect(0,0,W,H);ctx.save();ctx.scale(-1,1);ctx.drawImage(video,-W,0,W,H);ctx.restore();if(latestHands?.multiHandLandmarks?.length){latestHands.multiHandLandmarks.forEach((lm,ix)=>{ctx.strokeStyle=ix?'#ff9900':'#00f0ff';ctx.lineWidth=3;handBones.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo((1-lm[a].x)*W,lm[a].y*H);ctx.lineTo((1-lm[b].x)*W,lm[b].y*H);ctx.stroke()});lm.forEach(p=>{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((1-p.x)*W,p.y*H,4,0,Math.PI*2);ctx.fill()})});document.getElementById('handState').textContent=`พบ ${latestHands.multiHandLandmarks.length} มือ`}else document.getElementById('handState').textContent='ไม่พบมือ';if(latestPose?.poseLandmarks){const l=latestPose.poseLandmarks;ctx.strokeStyle='#10b981';ctx.lineWidth=4;[[11,13],[13,15],[12,14],[14,16],[11,12]].forEach(([a,b])=>{if(!l[a]||!l[b])return;ctx.beginPath();ctx.moveTo((1-l[a].x)*W,l[a].y*H);ctx.lineTo((1-l[b].x)*W,l[b].y*H);ctx.stroke()});const left=l[15],right=l[16],sl=l[11],sr=l[12];document.getElementById('armState').textContent=`ซ้าย: ${left&&sl?(left.y<sl.y-.08?'ยกขึ้น':'ปกติ'):'?'} | ขวา: ${right&&sr?(right.y<sr.y-.08?'ยกขึ้น':'ปกติ'):'?'}`}
 frameNo++;if(!processing&&video.readyState>=2){processing=true;(async()=>{try{await hands.send({image:video});if(frameNo%2===0)await pose.send({image:video})}finally{processing=false}})()}const f=snap();if(f&&db.length&&frameNo%2===0){live.push(f);if(live.length>45)live.shift()}if(frameNo%4===0)match();raf=requestAnimationFrame(draw)}
async function start(){if(active)return;initAI();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();active=true;document.getElementById('camState').textContent='LIVE';document.getElementById('camState').className='ok';live=[];draw()}catch(e){alert('เปิดกล้องไม่ได้: '+e.message+'\n\nกรุณาเปิดหน้า camera.html ผ่าน HTTPS หรือ localhost และกดอนุญาตกล้อง')}}
function stop(){active=false;cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;document.getElementById('camState').textContent='ปิดอยู่';document.getElementById('camState').className='warn'}
function post(data){return new Promise((resolve,reject)=>{const iframe=document.createElement('iframe');iframe.name='gasPost_'+Date.now()+'_'+Math.floor(Math.random()*10000);iframe.style.display='none';document.body.appendChild(iframe);const form=document.createElement('form');form.method='POST';form.action=GAS_WEBAPP_URL;form.target=iframe.name;form.style.display='none';Object.entries(data).forEach(([k,v])=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=typeof v==='object'?JSON.stringify(v):v;form.appendChild(input)});document.body.appendChild(form);let done=false;const finish=()=>{if(done)return;done=true;setTimeout(()=>{form.remove();iframe.remove()},300);resolve({status:'ok'})};iframe.addEventListener('load',finish,{once:true});form.submit();setTimeout(finish,2500)})}
document.getElementById('start').onclick=start;document.getElementById('stop').onclick=stop;document.getElementById('tts').onclick=()=>speak(document.getElementById('result').textContent);
document.getElementById('new').onclick=()=>{const id=document.getElementById('gid').value.trim(),text=document.getElementById('text').value.trim();if(!id||!text)return alert('ใส่ GestureID และคำแปลก่อน');recorded=[];recording=true;document.getElementById('record').textContent='เริ่มเก็บ '+id+' — 0 เฟรม'};
document.getElementById('capture').onclick=()=>{if(!recording)return alert('กดเริ่มเก็บก่อน');const f=snap();if(!f)return alert('ยังไม่พบมือหรือแขน');recorded.push(f);document.getElementById('record').textContent='เก็บแล้ว '+recorded.length+' เฟรม'};
document.getElementById('clear').onclick=()=>{recorded=[];recording=false;document.getElementById('record').textContent='0 เฟรม'};
document.getElementById('save').onclick=async()=>{if(!recording||!recorded.length)return alert('ยังไม่มีเฟรม');const id=document.getElementById('gid').value.trim(),text=document.getElementById('text').value.trim(),speech=document.getElementById('speech').value.trim()||text;try{document.getElementById('status').textContent='กำลังบันทึกลง Google Sheets...';for(let i=0;i<recorded.length;i++){await post({action:'addGestureFrame',gestureId:id,frameNo:i+1,text,speech,landmarkData:recorded[i]})}await new Promise(r=>setTimeout(r,1000));await loadDB();alert('บันทึก GestureDB สำเร็จ');recorded=[];recording=false;document.getElementById('record').textContent='บันทึกแล้ว';}catch(e){alert('บันทึกไม่สำเร็จ: '+e.message)}};
initAI();loadDB();
</script></body></html>
